[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihsg-screener"
version = "0.1.0"
description = "Screener EOD saham IDX: gate teknikal + sentimen berita IndoBERT"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "requests>=2.32",
    "transformers>=4.44",
    "torch>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
ihsg-screener = "ihsg_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ihsg_screener = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: butuh jaringan atau model asli; dilewati secara default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
